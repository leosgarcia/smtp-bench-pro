[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smtp-bench-pro"
version = "1.0.0"
description = "Professional SMTP Benchmark & Diagnostics"
authors = [
    { name = "WL Tech" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.5.0",
    "dnspython>=2.4.0",
    "tldextract>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-qt>=4.2.0",
    "ruff>=0.6.0",
    "bandit>=1.7.0",
    "pyinstaller>=6.10.0",
]

[project.scripts]
smtp-bench-pro = "smtp_bench_pro.__main__:main"

[project.entry-points."benchpro.modules"]
smtp = "smtp_bench_pro.integration.module:SMTPBenchModule"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v -m 'not network'"
markers = [
    "network: tests that require real network access",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "B", "SIM"]
ignore = ["UP006", "UP007"]

[tool.setuptools.packages.find]
where = ["src"]
